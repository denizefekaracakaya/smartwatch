[project]
name = "efetufe-backend"
version = "0.1.0"
description = "Cloud music & podcast streaming API with AI search assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "rapidfuzz>=3.9",
    "mutagen>=1.47",
    "anthropic>=0.70",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "B008", "E501"]  # line length is handled by `ruff format`

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"scripts/*" = ["S105", "S603"]
