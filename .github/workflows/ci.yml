name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run python scripts/smoke_test.py
      - run: uv run bandit -q -r app
      - run: uv run pip-audit

  backend-postgres:
    # Same test suite against PostgreSQL (the production database) instead of SQLite.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: efetufe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/efetufe_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest

  docker:
    # Builds the image and runs the full stack (API + PostgreSQL + Mailpit) end to end.
    runs-on: ubuntu-latest
    env:
      APP_SECRET_KEY: ci-compose-secret-key-0123456789abcdefghijkl
      APP_PUBLIC_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: docker compose up -d --build --wait
      - run: docker compose exec -T api python -m app.cli seed-demo --seconds 3
      - working-directory: backend
        run: |
          uv sync --frozen
          uv run python scripts/smoke_test.py --base-url http://localhost:8000 --mailpit http://localhost:8025
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Secrets are not available to pull requests from forks; those builds fall back to the debug key.
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "No signing secrets: debug-signed build"; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v5
        with:
          name: efetufe-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
